name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run GameTests
        run: ./gradlew build
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Client smoke test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientSmoke
      - if: always()
        run: grep -h "phantom_stress_fix\]" run/gametest/logs/latest.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build
          path: |
            build/libs/
            run/gametest/logs/
            run/smoke/screenshots/
            run/smoke/logs/
          if-no-files-found: ignore
